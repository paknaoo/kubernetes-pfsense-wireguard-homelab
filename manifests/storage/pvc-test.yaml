apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-path-test-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: local-path-test-pod
  namespace: default
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:stable
      command:
        - sh
        - -c
        - |
          echo "persistent storage test" > /data/test.txt
          cat /data/test.txt
          sleep 3600
      volumeMounts:
        - name: test-storage
          mountPath: /data
  volumes:
    - name: test-storage
      persistentVolumeClaim:
        claimName: local-path-test-pvc
