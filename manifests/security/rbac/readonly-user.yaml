apiVersion: v1
kind: Namespace
metadata:
  name: rbac-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: readonly-user
  namespace: rbac-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: readonly-user-view
subjects:
  - kind: ServiceAccount
    name: readonly-user
    namespace: rbac-lab
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
