apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-deployer
  namespace: demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-deployer-role
  namespace: demo
rules:
  - apiGroups: ["", "apps"]
    resources:
      - pods
      - services
      - configmaps
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-deployer-binding
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: demo-deployer
    namespace: demo
roleRef:
  kind: Role
  name: demo-deployer-role
  apiGroup: rbac.authorization.k8s.io
